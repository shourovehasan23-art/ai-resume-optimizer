<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI ATS Resume Optimizer - Results</title>
    <style>
        /* Full-screen loading overlay */
        .loading-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: radial-gradient(circle at 50% 70%, #a78bfa 0%, #7c3aed 40%, #4f46e5 100%);
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: fadeInBg 0.8s;
        }
        @keyframes fadeInBg {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .loading-card {
            background: rgba(34, 34, 54, 0.95);
            border-radius: 40px;
            box-shadow: 0 0 80px 0 #a78bfa, 0 0 160px 0 #7c3aed;
            padding: 48px 0;
            min-width: 600px;
            max-width: 90vw;
            text-align: center;
            color: #fff;
            font-family: 'Inter', sans-serif;
            animation: fadeInCard 1s cubic-bezier(.4,0,.2,1);
        }
        @keyframes fadeInCard {
            from { opacity: 0; transform: scale(0.96); }
            to { opacity: 1; transform: scale(1); }
        }
        .loading-card h1 {
            font-size: 2.8rem;
            font-weight: 800;
            margin: 0;
            letter-spacing: 1px;
        }
        .glow-loader {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            margin: 36px auto 0 auto;
            background: radial-gradient(circle at 60% 40%, #a78bfa 0%, #7c3aed 60%, #4f46e5 100%);
            box-shadow: 0 0 60px 20px #a78bfa, 0 0 120px 40px #7c3aed;
            animation: glowPulse 1.8s infinite alternate;
        }
        /* Animated glowing loader for analysis section */
        .glow-loader {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            margin: 30px auto 0 auto;
            background: radial-gradient(circle at 60% 40%, #a78bfa 0%, #7c3aed 60%, #4f46e5 100%);
            box-shadow: 0 0 60px 20px #a78bfa, 0 0 120px 40px #7c3aed;
            animation: glowPulse 1.8s infinite alternate;
        }
        @keyframes glowPulse {
            0% { box-shadow: 0 0 60px 20px #a78bfa, 0 0 120px 40px #7c3aed; opacity: 0.7; }
            100% { box-shadow: 0 0 90px 30px #a78bfa, 0 0 180px 60px #7c3aed; opacity: 1; }
        }
       /* --- START: NEW ABSTRACT PURPLE THEME CSS --- */
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap');

:root {
  --primary-color: #9f7aea; /* Light Purple */
  --secondary-color: #ed64a6; /* Pinkish */
  --background-color: #2d3748; /* Dark Grey Blue */
  --card-background: rgba(26, 32, 44, 0.7); /* Semi-transparent dark card */
  --text-primary: #ffffff;
  --text-secondary: #a0aec0; /* Light Grey */
  --border-color: rgba(255, 255, 255, 0.2);
  --success-color: #48bb78;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: 'Poppins', sans-serif;
    background-color: #41295a; /* Fallback color */
    background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1600 900'%3e%3cdefs%3e%3cradialGradient id='a' cx='352' cy='432' r='400' gradientUnits='userSpaceOnUse'%3e%3cstop offset='0' stop-color='%23A94FF7'/%3e%3cstop offset='1' stop-color='%2341295a'/%3e%3c/radialGradient%3e%3cradialGradient id='b' cx='1250' cy='250' r='500' gradientUnits='userSpaceOnUse'%3e%3cstop offset='0' stop-color='%23C32E95'/%3e%3cstop offset='1' stop-color='%2341295a'/%3e%3c/radialGradient%3e%3cradialGradient id='c' cx='800' cy='600' r='400' gradientUnits='userSpaceOnUse'%3e%3cstop offset='0' stop-color='%23A94FF7'/%3e%3cstop offset='1' stop-color='%2341295a'/%3e%3c/radialGradient%3e%3c/defs%3e%3crect fill='url(%23a)' width='1600' height='900'/%3e%3crect fill='url(%23b)' width='1600' height='900'/%3e%3crect fill='url(%23c)' width='1600' height='900'/%3e%3c/svg%3e");
    background-size: cover;
    color: var(--text-primary);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
}

.container {
    width: 100%;
    max-width: 800px;
    background-color: var(--card-background);
    border: 1px solid var(--border-color);
    backdrop-filter: blur(20px); /* Frosted glass effect */
    border-radius: 20px;
    box-shadow: 0 10px 50px rgba(0, 0, 0, 0.3);
    padding: 40px 50px;
    opacity: 0;
    transform: translateY(20px) scale(0.98);
    animation: fadeIn 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
}

@keyframes fadeIn {
    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

h1 { text-align: center; font-size: 2.5em; font-weight: 700; margin-bottom: 0.5em; }
.subheading { text-align: center; color: var(--text-secondary); margin-bottom: 2.5em; font-size: 1.1em; }
h3 { font-size: 1.5em; margin-bottom: 0.8em; border-bottom: 1px solid var(--border-color); padding-bottom: 0.5em;}

.form-group { margin-bottom: 2em; }
label { display: block; margin-bottom: 0.5em; font-weight: 600; color: var(--text-secondary); }

textarea {
    width: 100%;
    min-height: 200px;
    padding: 15px;
    border-radius: 10px;
    border: 1px solid var(--border-color);
    background-color: rgba(0, 0, 0, 0.25);
    color: var(--text-primary);
    font-family: 'Poppins', sans-serif;
    font-size: 1em;
    transition: all 0.3s ease;
}

textarea:focus {
    outline: none;
    border-color: var(--primary-color);
    box-shadow: 0 0 0 3px rgba(159, 122, 234, 0.5);
}

.btn-container { text-align: center; }

.btn {
    background: linear-gradient(90deg, var(--primary-color), var(--secondary-color));
    color: white;
    border: none;
    padding: 15px 30px;
    font-size: 1.1em;
    font-weight: 600;
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
}

.btn:hover {
    transform: translateY(-3px) scale(1.05);
    box-shadow: 0 7px 25px rgba(237, 100, 166, 0.3);
}

.btn:active { transform: scale(0.98); }

.spinner { display: none; margin: 20px auto; width: 40px; height: 40px; border: 4px solid rgba(255, 255, 255, 0.2); border-left-color: var(--primary-color); border-radius: 50%; animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* For results.html page */
.results-container { display: none; opacity: 0; animation: fadeIn 1s ease-out forwards; }
.result-section { margin-bottom: 2.5em; }
ul { list-style-position: inside; padding-left: 0; }
li { margin-bottom: 0.7em; font-size: 1.1em; }
#improvedResumeOutput { min-height: 300px; }
#copyMessage { margin-left: 10px; color: var(--success-color); font-weight: 600; }
/* --- END: NEW ABSTRACT PURPLE THEME CSS --- */
    </style>
</head>
<body>
    <div id="loadingOverlay" class="loading-overlay" style="display: none;">
        <div class="loading-card">
            <h1>Analysis Results</h1>
            <div class="glow-loader"></div>
        </div>
    </div>

    <div class="container">
        <h1>Analysis Results</h1>
        <div id="loadingState">
            <div class="glow-loader"></div>
            <h2 style="color: var(--text-light);">Our AI is analyzing your resume...</h2>
        </div>

        <div id="resultsContainer" class="results-container">
            <!-- Analysis will be injected here by JavaScript -->
        </div>
    </div>

    <script>
        // Show loading overlay when analysis starts
        function showLoadingOverlay() {
            document.getElementById('loadingOverlay').style.display = 'flex';
        }
        function hideLoadingOverlay() {
            document.getElementById('loadingOverlay').style.display = 'none';
        }
        function copyImprovedResume() {
    const textarea = document.getElementById('improvedResumeOutput');
    // Clipboard API ব্যবহার করুন
    navigator.clipboard.writeText(textarea.value)
        .then(() => {
            const copyMessage = document.getElementById('copyMessage');
            copyMessage.style.display = 'inline';
            setTimeout(() => { copyMessage.style.display = 'none'; }, 2000);
        })
        .catch(() => {
            alert('কপি করতে সমস্যা হয়েছে। ম্যানুয়ালি কপি করুন।');
        });
}

async function fetchAnalysis() {
    const resume = localStorage.getItem('resumeData');
    const jd = localStorage.getItem('jdData');
    const loadingState = document.getElementById('loadingState');
    const resultsContainer = document.getElementById('resultsContainer');
    showLoadingOverlay();

    if (!resume || !jd) {
        hideLoadingOverlay();
        loadingState.innerHTML = '<h2 style="color: red;">Error: Could not find resume data. Please go back and try again.</h2>';
        resultsContainer.style.display = 'none';
        return;
    }

    try {
        const response = await fetch('/.netlify/functions/analyze', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                resume: resume,
                jobDescription: jd
            })
        });

        let apiResponse;
        let text = await response.text();
        if (!text) {
            throw new Error('Server did not return any data. Please try again later.');
        }
        try {
            apiResponse = JSON.parse(text);
        } catch (jsonErr) {
            throw new Error('Server response is not valid JSON.');
        }

        if (!response.ok) {
            throw new Error(apiResponse.error || 'Something went wrong on the server.');
        }

        // Hide loading overlay and show results
        loadingState.style.display = 'none';
        hideLoadingOverlay();
        resultsContainer.style.display = 'block';
        resultsContainer.style.opacity = '0';
        setTimeout(() => {
            resultsContainer.style.opacity = '1';
        }, 50);

        // Markdown থেকে HTML কনভার্ট করুন
        let analysisHTML = apiResponse.analysis
            ? apiResponse.analysis.replace(/\*\*(.*?)\*\*/g, '<h3>$1</h3>') // Bold to h3
                .replace(/-\s(.*?)\n/g, '<li>$1</li>') // Bullet points to li
            : '<span style="color:red;">No analysis data returned.</span>';
        analysisHTML = `<ul>${analysisHTML}</ul>`.replace(/<h3>(.*?)<\/h3>/g, '</ul><h3>$1</h3><ul>');

        analysisHTML += `
            <div class="result-section">
                <h3>AI-Improved Resume</h3>
                <textarea id="improvedResumeOutput" readonly>${apiResponse.improvedResume || ''}</textarea>
                <br><br>
                <button class="btn" onclick="copyImprovedResume()">Copy Improved Resume</button>
                <span id="copyMessage" style="margin-left: 10px; color: var(--success-color); display: none;">Copied!</span>
            </div>
        `;
        resultsContainer.innerHTML = analysisHTML;

    } catch (error) {
        hideLoadingOverlay();
        resultsContainer.style.display = 'none';
        loadingState.innerHTML = `<h2 style="color: red;">Error: ${error.message}</h2>`;
        console.error('Fetch error:', error);
    }

    // Clear localStorage
    localStorage.removeItem('resumeData');
    localStorage.removeItem('jdData');
}

        // Run the analysis when the page loads
window.onload = function() {
    showLoadingOverlay(); // Show overlay as soon as page loads
    fetchAnalysis();
}
    </script>
</body>
</html>
