<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI ATS Resume Optimizer - Results</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #9f7aea;
            --secondary-color: #ed64a6;
            --background-start: #1e1b4b;
            --background-end: #0c0a2e;
            --card-background: rgba(26, 32, 44, 0.9);
            --text-primary: #ffffff;
            --text-secondary: #a0aec0;
            --success-color: #48bb78;
            --error-color: #ef4444;
            --border-color: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, var(--background-start), var(--background-end));
            min-height: 100vh;
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }

        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
            z-index: 1000;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .loading-card {
            background: rgba(41, 37, 66, 0.95);
            border-radius: 20px;
            padding: 3rem;
            text-align: center;
            box-shadow: 0 0 50px rgba(159, 122, 234, 0.3);
        }

        .glow-loader {
            width: 60px;
            height: 60px;
            margin: 0 auto 2rem auto;
            border-radius: 50%;
            background: linear-gradient(45deg, var(--primary-color), var(--secondary-color));
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 0.7; }
            50% { transform: scale(1.05); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.7; }
        }

        .container {
            max-width: 800px;
            width: 100%;
            background: var(--card-background);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 2.5rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }
        
        h1, h2, h3 {
            color: var(--text-primary);
            margin-bottom: 1.5rem;
        }

        h1 { text-align: center; }

        .analysis-section {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 2rem;
        }
        
        .analysis-section ul {
            list-style-type: none;
            padding-left: 0;
        }

        .analysis-section li {
            padding-left: 1.5em;
            text-indent: -1.5em;
            margin-bottom: 0.7em;
        }

        .analysis-section li::before {
            content: '⚡️';
            margin-right: 0.5em;
        }

        .improved-resume {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 1.5rem;
        }

        textarea {
            width: 100%;
            min-height: 300px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-primary);
            padding: 1rem;
            font-family: 'Poppins', sans-serif;
            margin-bottom: 1rem;
            resize: vertical;
        }

        .btn {
            background: linear-gradient(45deg, var(--primary-color), var(--secondary-color));
            color: white;
            border: none;
            padding: 0.8rem 1.5rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(159, 122, 234, 0.4);
        }

        #copyMessage {
            color: var(--success-color);
            margin-left: 1rem;
            display: none;
            font-weight: 600;
        }

        .error-message {
            color: var(--error-color);
            text-align: center;
            padding: 2rem;
        }
    </style>
</head>
<body>
    <div id="loadingOverlay" class="loading-overlay">
        <div class="loading-card">
            <div class="glow-loader"></div>
            <h2>Analyzing Your Documents</h2>
            <p style="color: var(--text-secondary);">Please wait while our AI works its magic...</p>
        </div>
    </div>

    <div class="container" id="resultsContainer" style="display: none;">
        <!-- Results will be injected here by JavaScript -->
    </div>

    <script>
        function copyImprovedResume() {
            const textarea = document.getElementById('improvedResumeOutput');
            const copyMessage = document.getElementById('copyMessage');

            if (!textarea || !navigator.clipboard) return;

            navigator.clipboard.writeText(textarea.value)
                .then(() => {
                    copyMessage.innerText = 'Copied!';
                    copyMessage.style.display = 'inline';
                    setTimeout(() => { copyMessage.style.display = 'none'; }, 2000);
                })
                .catch(err => {
                    console.error('Failed to copy text: ', err);
                    copyMessage.innerText = 'Failed!';
                    copyMessage.style.color = 'var(--error-color)';
                    copyMessage.style.display = 'inline';
                });
        }

        async function fetchAnalysis() {
            const resultsContainer = document.getElementById('resultsContainer');
            const loadingOverlay = document.getElementById('loadingOverlay');

            try {
                const resume = localStorage.getItem('resume');
                const jobDescription = localStorage.getItem('jobDescription');

                if (!resume || !jobDescription) {
                    throw new Error('Resume or Job Description data not found. Please go back to the homepage and submit again.');
                }
                
                // *** THIS IS THE CORRECTED LINE FOR VERCEL ***
                const response = await fetch('/api/analyze', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ resume, jobDescription })
                });

                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(errorText || 'Analysis failed due to a server error.');
                }
                
                const data = await response.json();

                // Format and display results
                let analysisHTML = `<h1>Analysis Results</h1>`;
                analysisHTML += `<div class="analysis-section">`;
                analysisHTML += data.analysis
                    .replace(/\*\*(.*?)\*\*/g, '<h3>$1</h3>')
                    .replace(/-\s(.*?)(?:\n|$)/g, '<li>$1</li>')
                    .replace(/<h3>(.*?)<\/h3>/g, '</div><div class="analysis-section"><h3>$1</h3>') // Wrap each section
                    .replace(/<\/li><li>/g, '</li><li>') // Clean up list items
                    .replace(/<\/li><br>/g, '</li>');
                analysisHTML += `</div>`;


                resultsContainer.innerHTML = analysisHTML + `
                    <div class="improved-resume">
                        <h2>AI-Improved Resume</h2>
                        <textarea id="improvedResumeOutput" readonly>${data.improvedResume}</textarea>
                        <button class="btn" onclick="copyImprovedResume()">Copy Improved Resume</button>
                        <span id="copyMessage"></span>
                    </div>
                `;

            } catch (error) {
                console.error('Error during analysis:', error);
                resultsContainer.innerHTML = `
                    <div class="error-message">
                        <h1>Analysis Failed</h1>
                        <p style="color: var(--text-secondary); margin-bottom: 2rem;">${error.message}</p>
                        <button class="btn" onclick="window.location.href='index.html'">Try Again</button>
                    </div>
                `;
            } finally {
                loadingOverlay.style.display = 'none';
                resultsContainer.style.display = 'block';
                localStorage.removeItem('resume');
                localStorage.removeItem('jobDescription');
            }
        }
        
        document.addEventListener('DOMContentLoaded', fetchAnalysis);
    </script>
</body>
</html>
